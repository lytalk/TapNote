name: TapNote
options:
  bundleIdPrefix: com.lytalk
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0"
targets:
  TapNote:
    type: application
    platform: iOS
    sources:
      - path: TapNote
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lytalk.TapNote
        INFOPLIST_FILE: TapNote/Info.plist
        CODE_SIGN_ENTITLEMENTS: TapNote/TapNote.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
        GENERATE_INFOPLIST_FILE: false
    entitlements:
      path: TapNote/TapNote.entitlements
    dependencies:
      - target: TapNoteWatch
    info:
      path: TapNote/Info.plist
      properties:
        CFBundleDisplayName: TapNote

  TapNoteWatch:
    type: application
    platform: watchOS
    sources:
      - path: TapNoteWatch
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lytalk.TapNote.watchkitapp
        INFOPLIST_FILE: TapNoteWatch/Info.plist
        CODE_SIGN_ENTITLEMENTS: TapNoteWatch/TapNoteWatch.entitlements
        GENERATE_INFOPLIST_FILE: false
        SKIP_INSTALL: true
    entitlements:
      path: TapNoteWatch/TapNoteWatch.entitlements
    dependencies:
      - target: TapNoteWatchWidgets
    info:
      path: TapNoteWatch/Info.plist
      properties:
        CFBundleDisplayName: TapNote
        WKCompanionAppBundleIdentifier: com.lytalk.TapNote

  TapNoteWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: TapNoteWatchWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lytalk.TapNote.watchkitapp.widgets
        INFOPLIST_FILE: TapNoteWatchWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: false
        SKIP_INSTALL: true
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    info:
      path: TapNoteWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: TapNote 表盘
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

schemes:
  TapNote:
    build:
      targets:
        TapNote: all
        TapNoteWatch: all
        TapNoteWatchWidgets: all
    run:
      config: Debug
      executable: TapNote
